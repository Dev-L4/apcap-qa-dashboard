      k, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  })
  .then(function(key){
    return crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64(PAYLOAD.iv), tagLength:128 }, key,
      concat(b64(PAYLOAD.ct), b64(PAYLOAD.tag)));
  })
  .then(function(dec){
    var html=new TextDecoder().decode(dec);
    try { sessionStorage.setItem('painel-aud-ok','1'); } catch(e){}
    document.open(); document.write(html); document.close();
  })
  .catch(function(){ err.textContent='Senha incorreta.'; btn.disabled=false; inp.select(); });
}
function concat(a,b){ var r=new Uint8Array(a.length+b.length); r.set(a); r.set(b,a.length); return r; }
