function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function sub(){
  var btn=document.getElementById('b'), inp=document.getElementById('p'), err=document.getElementById('e');
  var senha=inp.value; if(!senha) return;
  btn.disabled=true; err.textContent='';
  var enc=new TextEncoder();
  crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey'])
  .then(function(k){
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256' },
      k, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  })
  .then(function(key){
    return crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64(PAYLOAD.iv), tagLength:128 }, key,
      concat(b64(PAYLOAD.ct), b64(PAYLOAD.tag)));
  })
  .then(function(dec){
    var html=new TextDecoder().decode(dec);
    try { sessionStorage.setItem('painel-aud-ok','1'); } catch(e){}
    document.open(); document.write(html); document.close();
  })
  .catch(function(){ err.textContent='Senha incorreta.'; btn.disabled=false; inp.select(); });
}
function concat(a,b){ var r=new Uint8Array(a.length+b.length); r.set(a); r.set(b,a.length); return r; }
document.getElementById('f').addEventListener('submit', function(ev){ ev.preventDefault(); sub(); });
</script>
